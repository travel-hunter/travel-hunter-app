[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgres]
command=/bin/bash -lc "exec postgres -D \"$PGDATA\""
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/postgresql/postgres.log
stderr_logfile=/var/log/postgresql/postgres-error.log
priority=10

[program:backend]
command=/bin/bash -lc "until pg_isready -h 127.0.0.1 -p 5432 -U \"$POSTGRES_USER\"; do sleep 1; done; /app/.venv/bin/alembic upgrade head && exec /app/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000"
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/var/log/travel-hunter/backend.log
stderr_logfile=/var/log/travel-hunter/backend-error.log
priority=20

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx/access.log
stderr_logfile=/var/log/nginx/error.log
priority=30