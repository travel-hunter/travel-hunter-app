services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - travelhunter-db:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-staging}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?set AUTH_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-travel_hunter_refresh}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      NOTIFICATION_SCHEDULER_ENABLED: ${NOTIFICATION_SCHEDULER_ENABLED:-false}
      NOTIFICATION_RUN_AT: ${NOTIFICATION_RUN_AT:-09:00}
      NOTIFICATION_POLL_SECONDS: ${NOTIFICATION_POLL_SECONDS:-60}
      NOTIFICATION_RETRY_ENABLED: ${NOTIFICATION_RETRY_ENABLED:-true}
      NOTIFICATION_RETRY_MAX_ATTEMPTS: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:-3}
      NOTIFICATION_RETRY_DELAY_SECONDS: ${NOTIFICATION_RETRY_DELAY_SECONDS:-600}
      KAKAO_ALIMTALK_ENABLED: ${KAKAO_ALIMTALK_ENABLED:-false}
      SOLAPI_BASE_URL: ${SOLAPI_BASE_URL:-https://api.solapi.com}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:-}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:-}
      SOLAPI_PF_ID: ${SOLAPI_PF_ID:-}
      SOLAPI_TEMPLATE_ID_D7: ${SOLAPI_TEMPLATE_ID_D7:-}
      SOLAPI_TEMPLATE_ID_D1: ${SOLAPI_TEMPLATE_ID_D1:-}
      SOLAPI_FROM_NUMBER: ${SOLAPI_FROM_NUMBER:-}
      SOLAPI_DISABLE_SMS: ${SOLAPI_DISABLE_SMS:-true}
      SOLAPI_TIMEOUT_SECONDS: ${SOLAPI_TIMEOUT_SECONDS:-5}
      SOLAPI_WEBHOOK_SECRET: ${SOLAPI_WEBHOOK_SECRET:-}
      TRAVEL_HUNTER_PUBLIC_BASE_URL: ${TRAVEL_HUNTER_PUBLIC_BASE_URL:-}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      OAUTH_STATE_COOKIE_NAME: ${OAUTH_STATE_COOKIE_NAME:-travel_hunter_oauth_state}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL}
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:-}
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${STAGING_DOMAIN:-}
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./deploy/Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      caddy:
        condition: service_started
    restart: unless-stopped

volumes:
  travelhunter-db:
