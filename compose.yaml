services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travelhunter
      POSTGRES_USER: travelhunter
      POSTGRES_PASSWORD: travelhunter
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelhunter -d travelhunter"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - travelhunter-db:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql://travelhunter:travelhunter@db:5432/travelhunter
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://localhost:4173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
        VITE_DATA_SOURCE: backend
    ports:
      - "4173:4173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  travelhunter-db:
